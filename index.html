<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Skyline Payment | Vorschau</title>
<link rel="icon" href="assets/skyline-logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #1C1D20;
    --color-primary-soft: #2E3033;
    --color-accent: #B08D4F;
    --color-accent-hover: #8F6F38;
    --color-accent-light: #EDE2CB;
    --color-background: #FAF8F4;
    --color-surface: #FFFFFF;
    --color-text: #1C1D20;
    --color-text-muted: #6B665C;
    --color-border: #E4DDCF;
    --color-error: #B42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--color-background);
    color: var(--color-text);
    padding: 24px;
  }
  .gate-card {
    width: 100%;
    max-width: 420px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 14px;
    padding: 40px 36px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(28,29,32,0.08);
  }
  .gate-card img { height: 30px; margin: 0 auto 28px; display: block; }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin: 0 0 10px;
  }
  p.lede {
    color: var(--color-text-muted);
    font-size: 0.95rem;
    margin: 0 0 26px;
    line-height: 1.5;
  }
  form { display: flex; flex-direction: column; gap: 14px; }
  input[type="password"] {
    width: 100%;
    padding: 13px 16px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: var(--color-background);
    color: var(--color-text);
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--color-accent);
  }
  button {
    padding: 13px 16px;
    border: none;
    border-radius: 999px;
    background: var(--color-accent);
    color: var(--color-primary);
    font-weight: 600;
    font-size: 1rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button:hover { background: var(--color-accent-hover); color: #fff; }
  button:disabled { opacity: 0.6; cursor: default; }
  .error-msg {
    color: var(--color-error);
    font-size: 0.88rem;
    min-height: 1.2em;
    margin-top: 2px;
    display: none;
  }
  .error-msg.visible { display: block; }
  .gate-footer {
    margin-top: 26px;
    font-size: 0.78rem;
    color: var(--color-text-muted);
  }
</style>
</head>
<body>
  <div class="gate-card">
    <img src="assets/skyline-logo.webp" alt="Skyline Payment">
    <h1>Diese Vorschau ist noch nicht öffentlich</h1>
    <p class="lede">Bitte Passwort eingeben, um die Landingpage anzusehen.</p>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="gate-password" name="password" placeholder="Passwort" autocomplete="current-password" required autofocus>
      <button type="submit" id="gate-submit">Entsperren</button>
      <p class="error-msg" id="gate-error">Falsches Passwort. Bitte erneut versuchen.</p>
    </form>
    <p class="gate-footer">Skyline Payment &middot; interne Vorschau</p>
  </div>

  var STORAGE_KEY = "skylinePreviewUnlocked";

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  // Swap the current document's <head> and <body> for the decrypted page's,
  // via real DOM nodes (not document.write/open, which either no-ops while
  // the parser is still active or leaves stale compositor layers behind
  // once the lock screen has already painted).
  function renderHtml(html) {
    var newDoc = new DOMParser().parseFromString(html, "text/html");
    document.title = newDoc.title;
    document.documentElement.replaceChild(document.adoptNode(newDoc.head), document.head);
    document.documentElement.replaceChild(document.adoptNode(newDoc.body), document.body);
  }

  try {
    var cached = sessionStorage.getItem(STORAGE_KEY);
    if (cached) {
      renderHtml(cached);
      return;
    }
  } catch (e) { /* sessionStorage unavailable, fall through to password screen */ }

  async function deriveKey(password) {
    var enc = new TextEncoder();
    var salt = b64ToBytes(SALT_B64);
    var keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function tryUnlock(password) {
    var key = await deriveKey(password);
    var iv = b64ToBytes(IV_B64);
    var data = b64ToBytes(DATA_B64);
    var plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
    return new TextDecoder().decode(plainBuf);
  }

  var form = document.getElementById("gate-form");
  var input = document.getElementById("gate-password");
  var errorMsg = document.getElementById("gate-error");
  var submitBtn = document.getElementById("gate-submit");

  form.addEventListener("submit", function (evt) {
    evt.preventDefault();
    errorMsg.classList.remove("visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "Prüfe …";

    tryUnlock(input.value).then(function (html) {
      try { sessionStorage.setItem(STORAGE_KEY, html); } catch (e) {}
      renderHtml(html);
    }).catch(function () {
      errorMsg.classList.add("visible");
      submitBtn.disabled = false;
      submitBtn.textContent = "Entsperren";
      input.value = "";
      input.focus();
    });
  });
})();
